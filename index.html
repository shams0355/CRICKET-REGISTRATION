<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Player Registration</title>
  <style>
    :root { --green: #147d45; --dark: #10251b; --light: #f2f8f3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #10251b, #17683d);
      color: var(--dark);
    }
    .card {
      width: min(100%, 480px); background: #fff; border-radius: 22px;
      padding: 32px; box-shadow: 0 18px 55px #0003;
    }
    .ball { font-size: 42px; text-align: center; }
    h1 { margin: 8px 0; text-align: center; font-size: 27px; }
    .intro { text-align: center; color: #5b6b61; margin: 0 0 26px; line-height: 1.5; }
    label { display: block; font-weight: 700; margin: 15px 0 7px; font-size: 14px; }
    input {
      width: 100%; padding: 13px 14px; border: 1px solid #cbd8ce;
      border-radius: 10px; font-size: 16px; outline: none; background: #fbfdfb;
    }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px #147d451c; }
    button {
      width: 100%; border: 0; margin-top: 23px; padding: 14px;
      border-radius: 10px; background: var(--green); color: white;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #0e6537; }
    .note { margin: 15px 0 0; color: #68766d; font-size: 12px; line-height: 1.5; }
    #message { display: none; margin-top: 16px; padding: 12px; border-radius: 9px; background: #e8f7ed; color: #145b31; line-height: 1.5; }
    @media (max-width: 480px) { body { padding: 14px; } .card { padding: 24px 20px; } h1 { font-size: 24px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="ball" aria-hidden="true">🏏 🏏</div>
    <h1>Cricket Player Registration</h1>
    <p class="intro">Join the team! Fill in your details below.</p>

    <form id="registrationForm">
      <label for="name">Full Name</label>
      <input id="name" name="name" type="text" placeholder="Enter your full name" autocomplete="name" required maxlength="100" />

      <label for="phone">Phone Number</label>
      <input id="phone" name="phone" type="tel" placeholder="e.g. 03XX XXXXXXX" autocomplete="tel" required maxlength="25" />

      <label for="city">City</label>
      <input id="city" name="city" type="text" placeholder="Enter your city" autocomplete="address-level2" required maxlength="80" />

      <label for="age">Age</label>
      <input id="age" name="age" type="number" placeholder="Enter your age" min="5" max="100" required />

      <button type="submit">Register Now</button>
      <p class="note">Demo form: this page does not send or save registrations to a database. Connect a form service or backend before collecting real player details.</p>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>
  
<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycbyK1jLC6qmapcU3R0JFhDlpajD2-N8khFDcqLVyD625wiXcoNv5ojqDX1bggi8kmdLBaw/exec";

  const form = document.getElementById('registrationForm');
  const message = document.getElementById('message');
  const button = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', async function (event) {
    event.preventDefault();

    const playerName = document.getElementById('name').value.trim();
    const age = Number(document.getElementById('age').value);

    if (!playerName || age < 5 || age > 100) {
      message.style.display = 'block';
      message.textContent = 'Please enter a valid name and age (5–100).';
      return;
    }

    button.disabled = true;
    message.style.display = 'block';
    message.textContent = 'Submitting registration...';

    try {
      await fetch(scriptURL, {
        method: 'POST',
        body: new URLSearchParams(new FormData(form)),
        mode: 'no-cors'
      });

      message.textContent =
        'Registration submitted. Please check with the organizer if you need confirmation.';
      form.reset();

    } catch (error) {
      message.textContent =
        'Could not submit the registration. Please try again.';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>

</body>
</html>
